tags:
  name: Categories
  description: Category API for Users

paths:
  /api/categories:
    get:
      summary: Get all categories
      tags: [Categories]
      responses:
        '200':
          description: A list of categories
        '500':
          description: Server error

  /api/categories/{id}:
    get:
      summary: Get category by ID
      tags: [Categories]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category found
        '404':
          description: Category not found
