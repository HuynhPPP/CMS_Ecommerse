tags:
  name: Orders
  description: Order API for Users

paths:
  /api/orders:
    post:
      summary: Create a new order
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Order created successfully

  /api/orders/user/{userId}:
    get:
      summary: Get orders by user ID
      tags: [Orders]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Orders found

  /api/orders/{id}:
    get:
      summary: Get order details by ID
      tags: [Orders]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order found
        '404':
          description: Order not found
