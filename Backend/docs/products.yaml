tags:
  name: Products
  description: Product API for Users

paths:
  /api/products:
    get:
      summary: Get all products
      tags: [Products]
      responses:
        '200':
          description: A list of products

  /api/products/{id}:
    get:
      summary: Get product by ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
        '404':
          description: Product not found
